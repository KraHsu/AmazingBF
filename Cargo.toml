[package]
name = "AmazingBF"
version = "0.3.0+10code"
edition = "2024"
rust-version = "1.94"
description = "A Brainfuck interpreter and native x86_64 compiler with HIR/LIR pipeline stages."

[features]
gui = ["dep:tauri", "dep:tauri-build"]

[[bin]]
name = "bf-gui"
path = "src/bin/bf-gui.rs"
required-features = ["gui"]

[dependencies]
tauri = { version = "2", optional = true }

[dev-dependencies]
assert_cmd = "2.2.0"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "standard_suite"
harness = false

[build-dependencies]
tauri-build = { version = "2", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
