[package]
name = "AmazingBF"
version = "0.3.0+10code"
edition = "2024"
rust-version = "1.94"
description = "A Brainfuck interpreter and native x86_64 compiler with HIR/LIR pipeline stages."

[dependencies]

[dev-dependencies]
assert_cmd = "2.2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
