<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BF GUI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 512px; height: 512px; background: #000; overflow: hidden; }
    canvas {
      display: block;
      width: 512px;
      height: 512px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <canvas id="screen" width="256" height="256"></canvas>
  <script src="renderer.js"></script>
</body>
</html>
