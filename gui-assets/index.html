<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BF GUI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 512px;
      height: 512px;
      background:
        radial-gradient(circle at 50% 38%, #172127 0%, #081014 48%, #010304 100%);
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .shell {
      position: relative;
      width: 480px;
      height: 480px;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01)),
        linear-gradient(135deg, #0d151a, #020507);
      box-shadow:
        0 18px 48px rgba(0,0,0,0.65),
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 24px rgba(110,255,210,0.05);
      overflow: hidden;
    }
    canvas {
      position: absolute;
      inset: 16px;
      width: calc(100% - 32px);
      height: calc(100% - 32px);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-radius: 6px;
      background: #020405;
      box-shadow:
        inset 0 0 28px rgba(0,0,0,0.9),
        0 0 24px rgba(70,255,210,0.08);
    }
    #screen {
      opacity: 0;
      pointer-events: none;
    }
    .shell::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 6px;
      pointer-events: none;
      background:
        linear-gradient(115deg, rgba(255,255,255,0.16), rgba(255,255,255,0.02) 30%, rgba(255,255,255,0) 52%),
        radial-gradient(circle at 50% -10%, rgba(160,255,240,0.14), rgba(160,255,240,0) 56%);
      mix-blend-mode: screen;
      opacity: 0.7;
    }
    .shell::after {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 6px;
      pointer-events: none;
      box-shadow:
        inset 0 0 40px rgba(0,0,0,0.82),
        inset 0 0 12px rgba(90,255,220,0.08);
    }
  </style>
</head>
<body>
  <div class="shell">
    <canvas id="screen" width="256" height="256"></canvas>
    <canvas id="display" width="256" height="256"></canvas>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
